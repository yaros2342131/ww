<title>Брейнрот Лаборатория</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --espresso: #1f140e;
  --mocha: #33231a;
  --mocha-2: #402d21;
  --line: #5a4131;
  --crema: #f6e7c8;
  --crema-dim: #cbb593;
  --pomodoro: #e03a3e;
  --pomodoro-deep: #9e1b25;
  --limone: #ffd23f;
  --basilico: #57c84d;
  --lab: #33e1d6;
  --r0: #e9edf5; --r1: #4fa8ff; --r2: #b26bff; --r3: #ffc83d; --r4: #ff4f7b; --r5: #39f2e0;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--espresso); color: var(--crema); }
body { font-family: var(--body); font-size: 14px; line-height: 1.4; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--lab); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; text-transform: uppercase; }
h3 { font-size: 13px; }
.lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--crema-dim); font-weight: 800; }
.muted { color: var(--crema-dim); }
.wrap { padding-inline: 16px; padding-block: 0 40px; max-width: 1560px; margin: 0 auto; }

/* ---------- HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--espresso);
  border-bottom: 2px solid var(--line); padding-inline: 16px; padding-block: 8px; }
.hud-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; max-width: 1560px; margin: 0 auto; }
.brand { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1; color: var(--limone); }
.brand small { display: block; font-family: var(--body); font-size: 11px; color: var(--crema-dim); font-weight: 700; margin-top: 3px; }
.stat { display: flex; flex-direction: column; min-width: 64px; }
.stat b { font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat.cash b { color: var(--limone); font-size: 21px; }
.stat em { font-style: normal; color: var(--basilico); font-family: var(--mono); font-size: 12px; font-weight: 700; }
.hud-spacer { flex: 1 1 0; }
.cal { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal .chip { font-family: var(--mono); font-weight: 700; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 9px; font-family: var(--mono); font-size: 12px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--limone); color: #2a1c00; }
.btn { background: var(--mocha-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-weight: 800; font-size: 13px; }
.btn:hover { border-color: var(--crema-dim); }
.btn.go { background: var(--basilico); border-color: #3e9a36; color: #102a0c; }
.btn.hot { background: var(--pomodoro); border-color: var(--pomodoro-deep); color: #fff; }
.btn.gold { background: var(--limone); border-color: #c9a21c; color: #2a1c00; }
.btn.lab { background: var(--lab); border-color: #1fa89f; color: #03302d; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 8px; font-size: 12px; border-radius: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--mocha-2);
  border: 1px solid var(--line); font-size: 12px; font-weight: 800; white-space: nowrap; }

/* ---------- lobby strip: 8 лабораторий и лайки */
.lobbybar { margin-block: 12px; border-radius: var(--radius); background: var(--mocha); border: 1px solid var(--line); padding: 10px 14px;
  display: grid; grid-template-columns: minmax(200px, .9fr) 2.4fr; gap: 10px 18px; align-items: center; }
.lobbybar-title b { font-family: var(--display); font-size: 16px; color: var(--pomodoro); }
.lobbybar-title p { margin: 2px 0 0; font-size: 12px; }
.lobby { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 560px) { .lobby { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lob { display: flex; align-items: center; gap: 6px; background: var(--mocha-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px 6px; min-width: 0; }
.lob img { width: 28px; height: 28px; object-fit: contain; flex: none; }
.lob > div { flex: 1 1 auto; min-width: 0; }
.lob span { display: block; font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lob small { display: block; font-size: 10px; color: var(--crema-dim); font-family: var(--mono); }
.lob.you { border-color: var(--limone); }
.like { flex: none; display: grid; place-items: center; width: 34px; height: 30px; border-radius: 8px; background: #3b1420; border: 1px solid var(--pomodoro); padding: 0; }
.like img { width: 24px; height: 24px; }
.like.done { background: transparent; border-color: var(--line); opacity: .55; }
.like:hover:not(.done) { background: var(--pomodoro-deep); }

/* ---------- мем-мусор на пьяцце */
.junkbox { margin-top: 10px; border-radius: 12px; background: #2b2410; border: 1px solid #6b5f1b; padding: 8px; }
.junkbox .lbl { color: #fff3b0; }
.junks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.pile { position: relative; aspect-ratio: 1 / .9; border-radius: 10px; background: #3a3115; border: 1px dashed #6b5f1b; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end; padding: 2px; overflow: hidden; user-select: none; }
.pile.on { border-style: solid; border-color: var(--limone); background: radial-gradient(circle at 50% 70%, rgba(255,210,63,.25), transparent 65%), #3a3115; }
.pile img { position: absolute; left: 12%; top: 4%; width: 76%; height: 76%; object-fit: contain; transition: transform .08s; }
.pile.hit img { transform: scale(.88) rotate(5deg); }
.pile small { position: relative; z-index: 2; font-size: 10px; font-weight: 800; background: rgba(20,12,8,.8); border-radius: 6px; padding: 0 5px; white-space: nowrap; }
.pile.off small { color: var(--crema-dim); font-family: var(--mono); }
.belt-row.surge { animation: surge 1.4s ease-out; }
@keyframes surge { 0% { box-shadow: 0 0 0 0 rgba(255,210,63,.9); background: rgba(120,90,10,.95); } 100% { box-shadow: 0 0 0 14px rgba(255,210,63,0); } }

.eventbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.ev { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-radius: 12px; padding: 8px 12px; font-weight: 800;
  background: var(--mocha); border: 1px dashed var(--line); }
.ev.sat { background: #3b1420; border: 1px solid var(--pomodoro); }
.ev.thu { background: #13312e; border: 1px solid var(--lab); }
.hint { background: #2c2a10; border: 1px solid #6b5f1b; color: #fff3b0; }

/* ---------- main grid */
.grid { display: grid; gap: 14px; grid-template-columns: minmax(290px, 1fr) minmax(360px, 1.35fr) minmax(310px, 1.05fr); align-items: start; }
@media (max-width: 1250px) { .grid { grid-template-columns: minmax(280px, 1fr) minmax(340px, 1.3fr); } .panel { grid-column: 1 / -1; } }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .lobbybar { grid-template-columns: 1fr; } }
.card { background: var(--mocha); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }

/* ---------- belt */
.portal { display: flex; align-items: center; gap: 10px; background: #2a1d33; border: 1px solid #5a3f73; border-radius: 12px; padding: 6px 10px; }
.portal img { width: 46px; height: 46px; object-fit: contain; }
.portal .timers { font-family: var(--mono); font-size: 11.5px; line-height: 1.45; }
.belt { position: relative; margin-top: 8px; border-radius: 12px; background: repeating-linear-gradient(180deg, var(--pomodoro) 0 22px, #c92f36 22px 44px);
  border: 3px solid var(--limone); overflow: hidden; }
.belt-row { position: absolute; left: 6px; right: 6px; height: 58px; display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px;
  background: rgba(20,12,8,.84); border-radius: 10px; border: 1px solid rgba(255,255,255,.08); transition: transform .55s cubic-bezier(.3,.8,.3,1), opacity .4s;
  cursor: pointer; text-align: left; }
.belt-row:hover { background: rgba(40,26,18,.95); }
.belt-row .cap { width: 34px; height: 44px; object-fit: contain; flex: none; }
.belt-row .who { width: 46px; height: 46px; object-fit: contain; flex: none; }
.belt-row .nm { flex: 1 1 auto; min-width: 0; }
.belt-row .nm b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.belt-row .nm small { font-size: 11px; font-weight: 800; }
.belt-row .pr { font-family: var(--mono); font-weight: 700; font-size: 12.5px; color: var(--limone); white-space: nowrap; }
.belt-row.cant .pr { color: #ff8f8f; }
.belt-row.leaving { opacity: 0; }
.belt-end { text-align: center; font-size: 11px; color: var(--crema-dim); margin-top: 4px; }
.hands { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--mocha-2); border: 1px solid var(--line); min-height: 58px; }
.hands img { width: 42px; height: 42px; object-fit: contain; }
.stations { margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.st { background: var(--mocha-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 4px 8px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; font-weight: 800; font-size: 12px; text-align: center; position: relative; }
.st img { width: 58px; height: 58px; object-fit: contain; }
.st > span { max-width: 100%; overflow-wrap: anywhere; }
.st small { font-size: 10.5px; color: var(--crema-dim); font-weight: 700; }
.st.live { border-color: var(--lab); box-shadow: 0 0 0 2px rgba(51,225,214,.3); }
.st.live::after { content: "LIVE"; position: absolute; top: 4px; right: 6px; font-size: 9px; background: var(--pomodoro); color: #fff; padding: 1px 5px; border-radius: 6px; }

/* ---------- lab */
.incs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .incs { grid-template-columns: repeat(2, 1fr); } }
.inc { position: relative; background: radial-gradient(circle at 50% 35%, #3b4a54, #23191a 70%); border: 1px solid var(--line); border-radius: 14px;
  aspect-ratio: 3 / 4; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 6px; overflow: hidden; user-select: none; }
.inc .shell { position: absolute; inset: 8% 8% 22%; width: 84%; height: 70%; object-fit: contain; opacity: .95; }
.inc .inside { position: absolute; left: 50%; top: 34%; width: 38%; transform: translate(-50%, -50%); transition: transform .08s; }
.inc.hit .inside { transform: translate(-50%, -50%) scale(.9) rotate(-6deg); }
.inc .ring { position: absolute; left: 50%; top: 34%; width: 66%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: conic-gradient(var(--basilico) calc(var(--p) * 1%), rgba(255,255,255,.08) 0); -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%); mask: radial-gradient(circle, transparent 58%, #000 60%); }
.inc .tx { position: relative; z-index: 2; font-size: 11px; font-weight: 800; text-align: center; background: rgba(20,12,8,.8); border-radius: 8px; padding: 2px 6px; width: 100%; }
.inc .tx .mono { color: var(--basilico); font-size: 13px; }
.inc.locked { filter: grayscale(.85); opacity: .6; }
.inc.empty .tx { color: var(--limone); }
.float { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-family: var(--display); font-size: 13px; color: #fff; pointer-events: none;
  animation: up .8s ease-out forwards; text-shadow: 0 2px 0 #000; z-index: 5; white-space: nowrap; }
.float.crit { color: var(--limone); font-size: 17px; }
@keyframes up { to { transform: translate(-50%, -46px); opacity: 0; } }

.podium-head { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 8px; gap: 8px; flex-wrap: wrap; }
.podium { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 520px) { .podium { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.slot { position: relative; aspect-ratio: 1 / 1.08; max-width: 100%; border-radius: 12px; background: #2a1d15; border: 1px dashed var(--line);
  display: flex; align-items: flex-end; justify-content: center; padding: 0; overflow: hidden; }
.slot.filled { border-style: solid; background: radial-gradient(circle at 50% 110%, rgba(255,210,63,.12), transparent 60%), #2a1d15; }
.slot .ped { position: absolute; left: 10%; right: 10%; bottom: 7%; height: 17%; border-radius: 50%; background: var(--ped, #d9dde8);
  box-shadow: 0 5px 0 #151018, 0 6px 10px rgba(0,0,0,.5); }
.slot img { position: relative; width: 84%; height: 84%; object-fit: contain; margin-bottom: 12%; z-index: 1; }
.slot .inc-lbl { position: absolute; top: 3px; left: 4px; right: 4px; font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--basilico);
  background: rgba(20,12,8,.7); border-radius: 6px; text-align: center; z-index: 2; white-space: nowrap; overflow: hidden; }
.slot.ideal::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255,229,138,.55), transparent 60%); animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .35; } }
.slot.locked { opacity: .35; border-style: dotted; align-items: center; font-size: 10px; font-weight: 800; color: var(--crema-dim); }
.slot.empty { align-items: center; color: var(--crema-dim); font-size: 10px; font-weight: 800; }
.fams { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.fam-chip { font-size: 11.5px; }
.fam-chip b { color: var(--basilico); }
.fam-chip.full { border-color: var(--limone); }
.comps { display: flex; gap: 6px; flex-wrap: wrap; }
.comps .chip img { width: 22px; height: 22px; object-fit: contain; }

/* ---------- panel */
.tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.tabs button { background: var(--mocha-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font-weight: 800; font-size: 12px; }
.tabs button[aria-selected="true"] { background: var(--crema); color: var(--espresso); border-color: var(--crema); }
.tabs button .dot { display: inline-block; width: 7px; height: 7px; background: var(--pomodoro); border-radius: 50%; margin-left: 4px; vertical-align: middle; }
.pc { display: flex; flex-direction: column; gap: 10px; }
.pc p { margin: 0; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--mocha-2); border: 1px solid var(--line); text-align: left; width: 100%; }
button.row:hover { border-color: var(--crema-dim); }
.row img { width: 40px; height: 40px; object-fit: contain; flex: none; }
.row .grow { flex: 1 1 auto; min-width: 0; }
.row .grow b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .grow small { font-size: 11px; color: var(--crema-dim); font-weight: 700; }
.row.sel { border-color: var(--lab); background: #173633; }
.req { display: flex; align-items: center; gap: 8px; }
.req .ok { color: var(--basilico); font-weight: 900; }
.req .no { color: #ff8f8f; font-weight: 900; }
.box { border-radius: 12px; border: 1px solid var(--line); padding: 10px 12px; background: #2a1d15; }
.box.warn { border-color: #6b5f1b; background: #2c2a10; }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.dx { background: var(--mocha-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px; text-align: center; font-size: 10.5px; font-weight: 800; }
.dx img { width: 100%; aspect-ratio: 1; object-fit: contain; max-width: 100%; }
.dx.unk img { filter: brightness(0) invert(.25); }
.dx.soon { opacity: .45; }
.dx .rar { display: block; font-size: 9.5px; }
.timeline { display: flex; flex-direction: column; gap: 8px; }
.upd { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--mocha-2); }
.upd.now { border-color: var(--limone); }
.upd.past { opacity: .78; }
.upd .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.upd .imgs { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.upd .imgs img { width: 38px; height: 38px; object-fit: contain; background: #2a1d15; border-radius: 8px; }
.upd ul { margin: 6px 0 0; padding-left: 18px; }
.flow { display: grid; gap: 6px; }
.flow .step { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.flow .step i { font-style: normal; font-family: var(--display); font-size: 12px; background: var(--limone); color: #2a1c00; border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; }
.formula { font-family: var(--mono); font-size: 12px; background: #1a110c; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; overflow-x: auto; white-space: pre; }

/* ---------- toasts, modal */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 6px; max-width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast { background: #120b07; border: 1px solid var(--line); border-left: 4px solid var(--limone); border-radius: 10px; padding: 7px 10px; font-weight: 800; font-size: 12.5px;
  animation: tin .25s ease-out; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.toast.lab { border-left-color: var(--lab); }
.toast.hot { border-left-color: var(--pomodoro); }
.toast.bot { border-left-color: var(--crema-dim); font-weight: 700; color: var(--crema-dim); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(10,6,4,.72); display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--mocha); border: 1px solid var(--line); border-radius: 18px; padding: 16px; width: min(680px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.unit-top { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: center; }
@media (max-width: 460px) { .unit-top { grid-template-columns: 1fr; } }
.unit-top .pic { position: relative; background: radial-gradient(circle at 50% 70%, #4a3526, #2a1d15); border-radius: 14px; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; }
.unit-top .pic img { width: 88%; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.game-wrap { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #0f0a07; border: 1px solid var(--line); touch-action: none; }
.game-wrap canvas { display: block; width: 100%; height: auto; }
.game-bar { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; font-weight: 800; }
.pad { display: flex; gap: 8px; margin-top: 8px; }
.pad button { flex: 1; padding: 12px; font-family: var(--display); font-size: 16px; }
.pinata-stage { display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #3a2a55, #140e1c); border-radius: 12px; padding: 16px; user-select: none; }
.pinata-stage img { width: min(240px, 60vw); transition: transform .06s; cursor: pointer; }
.pinata-stage img.whack { transform: rotate(-9deg) scale(.95); }
.hp { height: 14px; border-radius: 999px; background: #241811; border: 1px solid var(--line); overflow: hidden; width: 100%; }
.hp i { display: block; height: 100%; background: linear-gradient(90deg, var(--pomodoro), var(--limone)); transition: width .15s; }
.devbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kbd { font-family: var(--mono); background: #120b07; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; font-size: 11.5px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>

<header class="hud">
  <div class="hud-row">
    <div class="brand">BRAINROT LAB<small>Лаборатория #1 · это ты</small></div>
    <div class="stat cash"><span class="lbl">Кэш</span><b id="h-cash">0</b><em id="h-inc">+0/с</em></div>
    <div class="stat"><span class="lbl">Лайки</span><b id="h-likes">0</b></div>
    <div class="stat"><span class="lbl">Кристаллы</span><b id="h-cr">0</b></div>

<script src="data.js"></script>
<script>
(() => {
"use strict";
const L = window.LAB, N = L.n;
const RAR = L.rarities, VAR = L.variants, BR = L.brainrots, FAM = L.families;
const RCOL = ["#e9edf5", "#4fa8ff", "#b26bff", "#ffc83d", "#ff4f7b", "#39f2e0"];
const CAPS = ["Capsule_Common", "Capsule_Rare", "Capsule_Epic", "Capsule_Legendary", "Capsule_Mythic", "Capsule_Iconic"];
const PED = ["linear-gradient(#f4f6fb,#b9bfcc)", "linear-gradient(#fff1a8,#d9a520 60%,#8a6a10)", "linear-gradient(#ffffff,#9ff0ff 50%,#56c7e0)",
  "conic-gradient(#ff3b3b,#ff9f1c,#ffe53b,#3bff6e,#3b8bff,#b23bff,#ff3b3b)", "radial-gradient(circle,#ffd200,#ff5a00 45%,#2b120a 70%)",
  "linear-gradient(90deg,#39ff14,#00e5a8,#ff2bd6)", "radial-gradient(circle at 30% 40%,#fff 0 3%,transparent 4%),radial-gradient(circle at 70% 60%,#fff 0 3%,transparent 4%),linear-gradient(#2a0f5c,#0b0620)"];
const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const DAYS_FULL = ["понедельник", "вторник", "среда", "четверг", "пятница", "суббота", "воскресенье"];
const THU = 3, SAT = 5, WINDOWS = 8, ROW_H = 64, SAVE_KEY = "brainrot-lab-save-v1";
const KEY = {}; BR.forEach((b, i) => KEY[b.key] = i);
const ICON_SAHUR = KEY.Tung_Tung_Tung_Sahur, ICON_TRALA = KEY.Tralalero_Tralala, ICON_67 = KEY.SixSeven_67;
const bimg = id => `img/b/${BR[id].key}.webp`;
const pimg = k => `img/p/${k}.webp`;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function weighted(ws) { const t = ws.reduce((a, b) => a + b, 0); if (t <= 0) return 0; let r = Math.random() * t; for (let i = 0; i < ws.length; i++) { if (r < ws[i]) return i; r -= ws[i]; } return ws.length - 1; }
const SUF = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc"];
function fmt(v) { v = Math.max(0, v); let i = 0; while (v >= 1000 && i < SUF.length - 1) { v /= 1000; i++; } if (i === 0) return String(Math.floor(v)); return (v >= 100 ? Math.floor(v) : Math.floor(v * 10) / 10) + SUF[i]; }
function ftime(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; }
const rarName = id => RAR[BR[id].rarity].name;
const varName = v => VAR[v].name;
const title = id => BR[id].title;

// ======================================================================= состояние
function fresh() {
  return { v: 1, cash: N.startCash, likes: 0, crystals: 0, rebirth: 0, superR: 0, uid: 1, units: [], reserve: [], carrying: null,
    inc: [null, null, null, null], fus: [null, null], tour: null, discovered: [], idealFound: [], recipesFound: [], familiesDone: [],
    shop: {}, unlocks: {}, companions: [], psurges: [], junk: null, likeDay: -1, liked: [], visitDay: -1, visits: [], t: 8 * 3600, quest: { day: -1, prog: [0, 0, 0], claimed: [false, false, false] },
    luckyDay: -1, eventWins: {}, hatched: 0, lastReal: Date.now(), speed: 1, sound: false, seenWeek: 0, fusionPick: [], tab: "guide" };
}
let S;
const T = { belt: [], cid: 1, beltAcc: 0, next: {}, bots: [], piles: [], botJunk: [], pileKey: "", pinata: null, lastRender: 0, lastHit: 0, podiumKey: "", mini: null, dirty: true };

function save() { try { S.lastReal = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* хранилище недоступно — игра работает без сохранения */ } }
function load() { try { const raw = localStorage.getItem(SAVE_KEY); if (!raw) return null; const s = JSON.parse(raw); return migrate(Object.assign(fresh(), s)); } catch (e) { return null; } }
// старые сохранения: «личные штормы» стали сёрджами
function migrate(s) { if (s.pstorms) { s.psurges = [...(s.psurges || []), ...s.pstorms]; delete s.pstorms; } return s; }

// ======================================================================= календарь
const week = () => Math.floor(S.t / 604800);
const dayIdx = () => Math.floor(S.t / 86400);
const weekday = () => dayIdx() % 7;
const hour = () => (S.t % 86400) / 3600;
const isSat = () => weekday() === SAT;
const isThu = () => weekday() === THU;
const isSpicy = () => week() === N.spicyWeek && isSat();

// ======================================================================= экономика
const shopLvl = k => S.shop[k] || 0;
const slotCount = () => Math.min(N.slotsMax, N.slotsStart + S.rebirth * N.slotsPer);
const incCount = () => Math.min(N.incMax, N.incStart + shopLvl("extra_incubator") + (S.unlocks.lab_pack ? 1 : 0));
const compSlots = () => Math.min(2, 1 + shopLvl("second_companion"));
const fusSlots = () => S.unlocks.fusion_pack ? 2 : 1;
const reserveMax = () => N.reserveMax + 5 * shopLvl("reserve_plus");
const unitBase = (id, v) => RAR[BR[id].rarity].income * VAR[v].mult;
const capsuleBase = (id, v) => { const r = RAR[BR[id].rarity]; return r.income * r.payback * VAR[v].mult; };
const byUid = uid => S.units.find(u => u.uid === uid);
const podiumIds = () => S.units.filter(u => u.slot >= 0).map(u => u.id);

function unitBonus(id, ids) {
  const b = BR[id], fam = FAM[b.family]; let bonus = 0; const parts = [];
  if (fam.key !== "icons") {
    const cnt = fam.members.filter(m => ids.includes(m)).length;
    const fb = L.familyBonus[Math.min(cnt, 4)] || 0;
    if (fb) { bonus += fb; parts.push(`семья «${fam.name}» ${cnt}/${fam.members.length}: +${Math.round(fb * 100)}%`); }
    if (cnt >= 2 && cnt >= fam.members.length) { bonus += L.familyFull; parts.push(`вся семья: +${Math.round(L.familyFull * 100)}%`); }
  }
  for (const c of L.combos) if (c.week <= week() && c.members.includes(id) && c.members.every(m => ids.includes(m))) { bonus += c.bonus; parts.push(`комбо «${c.name}»: +${Math.round(c.bonus * 100)}%`); }
  return { bonus, parts };
}
function companionPerk(perk) {
  let s = 0;
  for (const uid of S.companions) { const u = byUid(uid); if (!u) continue; const b = BR[u.id]; if (FAM[b.family].perk === perk) s += L.companionPerk[b.rarity] * (1 + 0.1 * u.v); }
  return s;
}
const hasComp = id => S.companions.some(uid => { const u = byUid(uid); return u && u.id === id; });
function globalMult() {
  let m = Math.pow(N.rebirthMult, S.rebirth) * Math.pow(N.superMult, S.superR);
  m *= 1 + S.idealFound.length * N.idealBonus;
  m *= 1 + companionPerk("cash_bonus");
  if (hasComp(ICON_67)) m *= 1.067;
  return m;
}
function baseIncome() { const ids = podiumIds(); return S.units.filter(u => u.slot >= 0).reduce((a, u) => a + unitBase(u.id, u.v) * (1 + unitBonus(u.id, ids).bonus), 0); }
const eventMult = () => isSat() ? N.eventIncome : 1;
const income = () => baseIncome() * globalMult() * eventMult();
const unitIncome = u => unitBase(u.id, u.v) * (1 + unitBonus(u.id, podiumIds()).bonus) * globalMult();
const capsulePrice = (id, v) => capsuleBase(id, v) * (1 - Math.min(0.4, companionPerk("belt_discount")));
const likesGain = base => Math.floor(base * (1 + companionPerk("likes_bonus")) * (isThu() ? N.miniLikes : 1));
const junkDouble = () => companionPerk("junk_bonus") + (hasComp(ICON_TRALA) ? 0.25 : 0);
const hatchSec = id => RAR[BR[id].rarity].hatch * (1 - Math.min(0.6, companionPerk("hatch_speed") + 0.1 * shopLvl("hatch_speed"))) / (isSat() ? N.eventHatch : 1);
const critChance = () => N.crit + companionPerk("pickaxe_crit") + 0.05 * shopLvl("pickaxe_crit") + (hasComp(ICON_SAHUR) ? 0.5 * N.crit : 0);
const critMult = () => hasComp(ICON_SAHUR) ? N.critMult * 1.5 : N.critMult;
const variantUpChance = () => companionPerk("variant_up") + (hasComp(ICON_TRALA) ? 0.1 : 0);
const idealChance = () => N.idealChance * (shopLvl("ideal_charm") ? 2 : 1) * (1 + companionPerk("ideal_luck"));
const rebirthCost = () => N.rebirthFirst * Math.pow(N.rebirthGrowth, S.rebirth);
const reqVariant = v => Math.min(6, v + S.superR);
const hasAtLeast = (id, v) => S.units.some(u => u.id === id && u.v >= v);
function nextReq() { return L.rebirthReqs[S.rebirth] || { ids: [], vars: [] }; }
const missingReqs = () => { const r = nextReq(); return r.ids.filter((id, i) => !hasAtLeast(id, reqVariant(r.vars[i]))).length; };
const canRebirth = () => S.rebirth < N.rebirthLevels && S.cash >= rebirthCost() && missingReqs() === 0;
const hasRainbowLegend = () => S.units.some(u => BR[u.id].rarity >= 3 && u.v >= 3);
const canSuper = () => week() >= N.superWeek && S.rebirth >= N.superRebirth && hasRainbowLegend();
const superCrystals = () => L.superCrystals[Math.min(S.rebirth, N.rebirthLevels) - N.superRebirth] || 0;
const upgradeCost = u => (L.upgrade[BR[u.id].rarity] || [])[u.v] || 0;
const canUpgrade = u => { const c = upgradeCost(u); const nv = VAR[u.v + 1]; return c > 0 && nv && nv.week <= week() && S.likes >= c; };
const sellCash = u => capsuleBase(u.id, u.v) * N.sellShare;
const sellLikes = u => RAR[BR[u.id].rarity].sellLikes * (u.v + 1);
function freeSlot() { const used = new Set(S.units.filter(u => u.slot >= 0).map(u => u.slot)); for (let i = 0; i < slotCount(); i++) if (!used.has(i)) return i; return -1; }
const beltPool = (r, wk) => BR.map((b, i) => [b, i]).filter(([b]) => b.rarity === r && b.source === "belt" && b.week <= wk).map(([, i]) => i);
function randomBrainrot(r, wk) { while (r > 0 && !beltPool(r, wk).length) r--; const p = beltPool(r, wk); return p.length ? pick(p) : 0; }

// ======================================================================= сообщения и звук
function toast(text, kind = "") {
  const el = document.createElement("div"); el.className = "toast " + kind; el.textContent = text;
  const box = $("#toasts"); box.appendChild(el); while (box.children.length > 5) box.firstChild.remove();
  setTimeout(() => el.remove(), 5200);
}
let AC = null;
function sfx(type) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
    const f = { buy: [520, 780], hatch: [660, 990], crit: [880, 1320], boom: [220, 440], hit: [300, 240], win: [520, 1040], no: [200, 150] }[type] || [440, 440];
    o.type = type === "boom" ? "sawtooth" : "triangle"; const t = AC.currentTime;
    o.frequency.setValueAtTime(f[0], t); o.frequency.exponentialRampToValueAtTime(f[1], t + 0.12);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + (type === "boom" ? 0.6 : 0.18));
    o.start(t); o.stop(t + 0.62);
  } catch (e) { /* звук не обязателен */ }
}

// ======================================================================= задания
const QUEST_TEXT = { hatch: n => `Выведи ${n} брейнротов`, buy_capsule: n => `Купи ${n} капсул`, pickaxe_hit: n => `Сделай ${n} ударов по инкубаторам`,
  sell: n => `Продай ${n} брейнротов`, junk: n => `Сдай мем-мусор Сахуру (${n})`, like: n => `Лайкни ${n} чужие лаборатории`, tour: n => `Отправь на гастроли (${n})`,
  upgrade: n => `Улучши вариант (${n})`, hatch_epic: n => `Выведи ${n} Эпических или выше`, fusion: n => `Скрести брейнротов (${n})` };
function todayQuests() { const d = dayIdx(); return ["easy", "medium", "hard"].map(k => L.quests[k][d % L.quests[k].length]); }
function ensureQuestDay() { if (S.quest.day !== dayIdx()) S.quest = { day: dayIdx(), prog: [0, 0, 0], claimed: [false, false, false] }; }
function addQuest(kind, n = 1) { ensureQuestDay(); todayQuests().forEach((q, i) => { if (q.kind === kind) S.quest.prog[i] += n; }); }
const questReady = i => { ensureQuestDay(); const q = todayQuests()[i]; return S.quest.prog[i] >= q.target && !S.quest.claimed[i]; };

// ======================================================================= лобби и лайки от гостей
const BOT_NAMES = ["Pizza_Nonna", "Brr_Master", "Capy_Lover", "Frigo77", "NoobiniKing", "Shark_Runner", "Bombardino_Pro"];
function initBots() {
  T.bots = BOT_NAMES.map((name, i) => ({ name, plot: i + 2, best: randomBrainrot(rint(0, 2), 0), rebirth: rint(0, 3) }));
  T.botJunk = []; T.lobbyKey = "";
}
function botsTick(dt) {
  const wk = week();
  for (const b of T.bots) {
    if (Math.random() < 0.004 * dt) {
      const r = weighted([55, 28, 12, 4.5, wk >= N.gMythicWeek ? 0.8 : 0]); const id = randomBrainrot(r, wk);
      if (RAR[BR[id].rarity].income >= RAR[BR[b.best].rarity].income) b.best = id;
      if (r >= 4) toast(`${b.name} вывел Мифика: ${title(id)}!`, "bot");
    }
    if (Math.random() < 0.00025 * dt) { b.rebirth++; toast(`${b.name} переродился — перерождение ${b.rebirth}`, "bot"); }
  }
  // боты тоже носят мусор Сахуру — сёрдж на общем конвейере может купить любой
  T.botJunk = T.botJunk.filter(j => { if (S.t < j.at) return true; deliverSurge(L.junk[j.kind], 1, j.bot.plot, j.bot.name); return false; });
  // гости заходят в твою лабораторию и лайкают её: каждый не чаще раза в день
  if (S.visitDay !== dayIdx()) {
    S.visitDay = dayIdx(); S.gotLikes = 0; const d0 = dayIdx() * 86400;
    S.visits = T.bots.filter(() => Math.random() < 0.6).map(b => ({ name: b.name, at: Math.max(S.t + rnd(20, 240), d0 + rnd(9, 23) * 3600) }));
  }
  S.visits = S.visits.filter(v => {
    if (S.t < v.at) return true;
    if (!S.units.some(u => u.slot >= 0)) { v.at = S.t + 600; return true; }   // на пустой подиум не смотрят
    S.likes += N.ownerLikes; S.gotLikes = (S.gotLikes || 0) + 1; T.dirty = true;
    toast(`${v.name} зашёл в гости и лайкнул твою лабораторию: +${N.ownerLikes} Лайков`, "lab"); return false;
  });
}
const likedToday = plot => S.likeDay === dayIdx() && S.liked.includes(plot);
function likePlot(plot) {
  const b = T.bots.find(x => x.plot === plot); if (!b) return;
  if (S.likeDay !== dayIdx()) { S.likeDay = dayIdx(); S.liked = []; }
  if (S.liked.includes(plot)) { toast("Сегодня ты уже лайкал эту лабораторию — завтра снова можно", "bot"); return; }
  S.liked.push(plot); S.likes += N.guestLikes; addQuest("like"); sfx("buy");
  toast(`Лайк лаборатории #${plot} (${b.name})! +${N.guestLikes} Лайков тебе, +${N.ownerLikes} хозяину`, "lab");
}

// ======================================================================= мем-мусор и сёрдж (как Chopper в Droid Tycoon)
const JUNK_IMG = L.junk.map(k => ({ 1: "JunkPile_Gold", 3: "JunkPile_Rainbow", 4: "JunkPile_Lava" })[k.variant] || "JunkPile_Gold");
function initJunk() { T.piles = Array.from({ length: N.junkSpots }, () => ({ kind: -1, left: 0, at: S.t + rnd(2, 20) })); T.pileKey = ""; }
function spawnPile(p) {
  const wk = week(), spicy = isSpicy();
  p.kind = weighted(L.junk.map(k => k.week > wk ? 0 : spicy && k.variant === 4 ? N.spicyLava : k.weight)); p.left = N.junkHits;
}
function clearPile(p) { p.kind = -1; p.at = S.t + N.junkRespawn * (isSpicy() ? N.spicyRespawn : 1); }
function junkTick() { T.piles.forEach(p => { if (p.kind < 0 && S.t >= p.at) spawnPile(p); }); }
function hitPile(i) {
  const now = performance.now(); if (now - T.lastHit < 90) return; T.lastHit = now;
  const p = T.piles[i]; if (!p || p.kind < 0) return;
  p.left--; sfx("hit");
  const box = document.querySelector(`[data-pile="${i}"]`); if (box) { box.classList.add("hit"); setTimeout(() => box.classList.remove("hit"), 80); }
  if (p.left > 0) return;
  if (S.junk) { p.left = 1; toast("Руки заняты мусором — сначала отнеси его Сахуру", "hot"); sfx("no"); return; }
  const count = Math.random() < junkDouble() ? 2 : 1, k = L.junk[p.kind];
  S.junk = { kind: p.kind, count }; clearPile(p); sfx("buy"); T.dirty = true;
  toast(`Подобран: ${k.name}${count > 1 ? " ×2" : ""}. Неси Сахуру — станция «Сахур» ниже`, "lab");
}
// капсула ближе всех к порталу с вариантом ниже становится вариантом мусора
function applySurge(v) {
  for (let i = 0; i < WINDOWS; i++) {
    const c = T.belt[i]; if (!c || c.v >= v) continue;
    const el = document.querySelector(`[data-cid="${c.cid}"]`); if (el) el.remove();
    T.belt[i] = { cid: T.cid++, id: c.id, v, surge: true }; return T.belt[i];
  }
  return null;
}
function deliverSurge(k, count, plot, name) {
  let hit = null; for (let n = 0; n < count; n++) hit = applySurge(k.variant) || hit;
  if (!hit) return false;
  toast(`СЁРДЖ! Лаборатория #${plot} (${name}) сдала Сахуру ${k.name}: капсула ${title(hit.id)} на конвейере теперь «${varName(k.variant)}»`, plot === 1 ? "hot" : "lab");
  renderBelt(); return true;
}
function deliverJunk() {
  if (!S.junk) { toast(`Нет мусора — разбей кучу мем-мусора на пьяцце (${N.junkHits} ударов)`, "hot"); sfx("no"); return; }
  const k = L.junk[S.junk.kind], count = S.junk.count; S.junk = null; addQuest("junk");
  if (deliverSurge(k, count, 1, "ты")) sfx("win");
  else toast(`Сахур принял мусор, но на конвейере нет капсулы ниже «${varName(k.variant)}»`, "bot");
}

// ======================================================================= конвейер
function initBelt() {
  T.belt = Array(WINDOWS).fill(null);
  T.next = { legend: S.t + N.gLegend, rainbow: S.t + N.gRainbow, mythic: S.t + N.gMythic, lava: S.t + N.gLava };
  for (let i = 0; i < WINDOWS; i++) beltStep(true);
}
function rollVariant() { const x = Math.random(), rb = VAR[3].belt, dm = VAR[2].belt, gd = VAR[1].belt; return x < rb ? 3 : x < rb + dm ? 2 : x < rb + dm + gd ? 1 : 0; }
function rollCapsule(quiet) {
  const wk = week();
  let r = weighted(RAR.slice(0, 5).map(d => d.weight)), v = rollVariant();
  if (S.t >= T.next.legend) { T.next.legend = S.t + N.gLegend; r = Math.max(r, 3); }
  if (wk >= N.gMythicWeek && S.t >= T.next.mythic) { T.next.mythic = S.t + N.gMythic; r = 4; }
  if (S.t >= T.next.rainbow) { T.next.rainbow = S.t + N.gRainbow; v = Math.max(v, 3); }
  if (wk >= N.gLavaWeek && S.t >= T.next.lava) { T.next.lava = S.t + N.gLava; v = Math.max(v, 4); }
  const id = randomBrainrot(r, wk);
  if (!quiet && (BR[id].rarity >= 3 || v >= 3)) toast(`На конвейере: ${title(id)} — ${rarName(id)}, ${varName(v)}!`, "hot");
  return { cid: T.cid++, id, v };
}
function beltStep(quiet) {
  const gone = T.belt[WINDOWS - 1];
  if (gone) { const el = document.querySelector(`[data-cid="${gone.cid}"]`); if (el) { el.classList.add("leaving"); setTimeout(() => el.remove(), 420); } }
  T.belt = [rollCapsule(quiet), ...T.belt.slice(0, WINDOWS - 1)];
  if (!quiet && Math.random() < 0.3) {
    const i = rint(2, WINDOWS - 1), c = T.belt[i];
    if (c) { const bot = pick(T.bots); T.belt[i] = null; const el = document.querySelector(`[data-cid="${c.cid}"]`); if (el) { el.classList.add("leaving"); setTimeout(() => el.remove(), 420); }
      if (BR[c.id].rarity >= 3) toast(`${bot.name} купил ${title(c.id)} с конвейера`, "bot"); }
  }
  // иногда бот забирает кучу мем-мусора и через полминуты сдаёт её Сахуру
  if (!quiet && Math.random() < 0.07) {
    const act = T.piles.filter(p => p.kind >= 0);
    if (act.length) { const p = pick(act); T.botJunk.push({ bot: pick(T.bots), kind: p.kind, at: S.t + rnd(10, 30) }); clearPile(p); }
  }
  renderBelt();
}
function buyCapsule(cid) {
  const i = T.belt.findIndex(c => c && c.cid === cid); if (i < 0) return;
  const c = T.belt[i];
  if (S.carrying) { toast("Руки заняты — сначала положи капсулу в инкубатор", "hot"); sfx("no"); return; }
  const price = capsulePrice(c.id, c.v);
  if (S.cash < price) { toast(`Не хватает Кэша: нужно ${fmt(price)}`, "hot"); sfx("no"); return; }
  S.cash -= price; let v = c.v;
  if (S.psurges.length) { v = Math.max(v, S.psurges.shift()); toast(`Твой сёрдж сработал: ${varName(v)}!`, "lab"); }
  if (v < 3 && Math.random() < 0.02 * shopLvl("belt_luck")) { v++; toast("Удача конвейера: вариант выше!", "lab"); }
  S.carrying = { id: c.id, v }; T.belt[i] = null; addQuest("buy_capsule"); sfx("buy");
  const el = document.querySelector(`[data-cid="${cid}"]`); if (el) el.remove();
  toast(`Куплено: ${title(c.id)} (${varName(v)}). Неси в инкубатор!`);
  renderBelt(); renderHands(); renderIncs();
}

// ======================================================================= инкубаторы и вылупление
function addReserve(c) { if (S.reserve.length < reserveMax()) S.reserve.push(c); else { S.likes += RAR[BR[c.id].rarity].sellLikes * 2; toast("Запас капсул полон — лишняя капсула превратилась в Лайки", "bot"); } }
function takeCapsule() { if (S.carrying) { const c = S.carrying; S.carrying = null; return c; } return S.reserve.shift() || null; }
function incInteract(i) {
  if (i >= incCount()) { toast("Инкубатор закрыт — открой его в Хайп-магазине (250 кристаллов)", "hot"); return; }
  const cur = S.inc[i];
  if (cur) { hitInc(i); return; }
  const c = takeCapsule();
  if (!c) { toast("Нет капсулы — купи её на конвейере слева", "hot"); sfx("no"); return; }
  const sec = hatchSec(c.id); S.inc[i] = { id: c.id, v: c.v, ends: S.t + sec, total: sec };
  toast("Капсула в инкубаторе! Кликай по нему — это удары киркой, вылупится быстрее");
  renderHands(); renderIncs();
}
function hitInc(i) {
  const now = performance.now(); if (now - T.lastHit < 90) return; T.lastHit = now;
  const cur = S.inc[i]; if (!cur) return;
  const crit = Math.random() < critChance(), amt = crit ? N.hit * critMult() : N.hit;
  cur.ends -= amt; addQuest("pickaxe_hit");
  const box = document.querySelector(`[data-inc="${i}"]`);
  if (box) { box.classList.add("hit"); setTimeout(() => box.classList.remove("hit"), 80);
    const f = document.createElement("span"); f.className = "float" + (crit ? " crit" : ""); f.textContent = crit ? `КРИТ −${amt.toFixed(1)} с` : `−${amt.toFixed(1)} с`;
    box.appendChild(f); setTimeout(() => f.remove(), 820); }
  sfx(crit ? "crit" : "hit");
}
function hatch(id, v, fromInc) {
  if (fromInc && v < 3 && Math.random() < variantUpChance()) v++;
  const ideal = Math.random() < idealChance(), isNew = !S.discovered.includes(id);
  const u = { uid: S.uid++, id, v, ideal, slot: freeSlot() }; S.units.push(u); S.hatched++;
  if (isNew) S.discovered.push(id);
  if (ideal && !S.idealFound.includes(id)) S.idealFound.push(id);
  addQuest("hatch"); if (BR[id].rarity >= 2) addQuest("hatch_epic");
  const t = `${title(id)} (${varName(v)})`;
  toast(u.slot >= 0 ? `${t} вылупился и встал на подиум!` : `${t} вылупился! Подиум полон — он в запасе`, "lab");
  if (isNew) toast(`Новый вид в Мемопедии: ${title(id)}`, "lab");
  if (ideal) toast(`ИДЕАЛЬНЫЙ ${t}! +1% ко всему доходу навсегда`, "hot");
  sfx("hatch"); checkFamilies(); T.dirty = true;
}
function checkFamilies() {
  const ids = podiumIds();
  FAM.forEach((f, fi) => {
    if (f.key === "icons" || S.familiesDone.includes(fi)) return;
    if (f.members.every(m => ids.includes(m))) { S.familiesDone.push(fi); toast(`Собрана вся семья «${f.name}»! Её брейнроты получают ещё +${Math.round(L.familyFull * 100)}%`, "lab"); }
  });
}

// ======================================================================= действия с брейнротами
function place(uid) { const u = byUid(uid), s = freeSlot(); if (!u) return; if (s < 0) { toast("Подиум полон — сначала убери кого-нибудь", "hot"); return; } u.slot = s; checkFamilies(); T.dirty = true; }
function unplace(uid) { const u = byUid(uid); if (u) { u.slot = -1; T.dirty = true; } }
function upgrade(uid) { const u = byUid(uid); if (!u || !canUpgrade(u)) return; S.likes -= upgradeCost(u); u.v++; addQuest("upgrade"); toast(`${title(u.id)} теперь ${varName(u.v)}!`, "lab"); sfx("win"); T.dirty = true; }
function sell(uid) {
  const u = byUid(uid); if (!u) return; const c = sellCash(u), l = likesGain(sellLikes(u));
  S.cash += c; S.likes += l; removeUnit(uid); addQuest("sell"); toast(`Продано: +${fmt(c)} Кэша и ${l} Лайков`); T.dirty = true;
}
function removeUnit(uid) { S.units = S.units.filter(u => u.uid !== uid); S.companions = S.companions.filter(x => x !== uid); S.fusionPick = S.fusionPick.filter(x => x !== uid); }
function toggleCompanion(uid) {
  if (S.companions.includes(uid)) S.companions = S.companions.filter(x => x !== uid);
  else if (S.companions.length < compSlots()) S.companions.push(uid);
  else S.companions = [...S.companions.slice(1), uid];
  T.dirty = true;
}
function autoArrange() {
  S.units.forEach(u => u.slot = -1);
  for (let s = 0; s < slotCount(); s++) {
    let best = null, bestVal = -1;
    for (const u of S.units) { if (u.slot >= 0) continue; u.slot = s; const val = baseIncome(); u.slot = -1; if (val > bestVal) { bestVal = val; best = u; } }
    if (!best) break; best.slot = s;
  }
  checkFamilies(); T.dirty = true; toast("Расставлено по максимальному доходу с учётом семей и комбо");
}
function doRebirth() {
  if (!canRebirth()) return; S.cash = 0; S.rebirth++; T.dirty = true; sfx("win");
  toast(`ПЕРЕРОЖДЕНИЕ ${S.rebirth}! Доход ×${N.rebirthMult} и +1 место на подиуме`, "hot");
}
function doSuper() {
  if (!canSuper()) return; const g = superCrystals();
  S.crystals += g; S.superR++; S.rebirth = 0; S.cash = N.startCash;
  const lim = slotCount(); S.units.forEach(u => { if (u.slot >= lim) u.slot = -1; });
  T.dirty = true; sfx("boom"); toast(`ВИРУСНЫЙ ВЗРЫВ! +${g} Хайп-кристаллов, доход ×${N.superMult} навсегда`, "hot");
}

// ======================================================================= скрещивание
function fusionPreview() {
  const p = S.fusionPick.map(byUid).filter(Boolean);
  if (p.length !== 3) return { ok: false, note: `Выбери 3 брейнрота (${p.length}/3)` };
  const speed = Math.min(0.6, companionPerk("fusion_speed") + (S.unlocks.fusion_pack ? 0.5 : 0));
  const [a, b, c] = p;
  if (a.id === b.id && b.id === c.id && a.v === b.v && b.v === c.v) {
    const nv = VAR[a.v + 1]; if (!nv || nv.week > week()) return { ok: false, note: "Следующий вариант пока закрыт" };
    return { ok: true, id: a.id, v: a.v + 1, recipe: -1, min: N.fusionVarMin * (1 - speed), note: `3 одинаковых → ${title(a.id)} (${nv.name})` };
  }
  const ids = p.map(u => u.id);
  const ri = L.recipes.findIndex(r => BR[r.result].week <= week() && r.inputs.every(x => ids.includes(x)));
  if (ri < 0) return { ok: false, note: "Такой комбинации нет. Подсказки — в Мемопедии" };
  const r = L.recipes[ri];
  return { ok: true, id: r.result, v: Math.min(a.v, b.v, c.v), recipe: ri, min: N.fusionMin[BR[r.result].rarity] * (1 - speed), note: `Секретный рецепт: ${title(r.result)}!` };
}
const fusionCost = p => 2 * capsuleBase(p.id, 0);
function startFusion() {
  const p = fusionPreview(); if (!p.ok) { toast(p.note, "hot"); return; }
  const slot = S.fus.findIndex((f, i) => i < fusSlots() && !f); if (slot < 0) { toast("Все колбы заняты", "hot"); return; }
  const cost = fusionCost(p); if (S.cash < cost) { toast(`Не хватает Кэша: нужно ${fmt(cost)}`, "hot"); return; }
  S.cash -= cost; S.fusionPick.forEach(removeUnit); S.fusionPick = [];
  S.fus[slot] = { id: p.id, v: p.v, ends: S.t + p.min * 60, total: p.min * 60 };
  addQuest("fusion");
  if (p.recipe >= 0 && !S.recipesFound.includes(p.recipe)) { S.recipesFound.push(p.recipe); toast(`Ты первым в лобби открыл секретный рецепт: ${title(p.id)}!`, "hot"); }
  toast(`Скрещивание началось: ${title(p.id)} через ${ftime(p.min * 60)}`, "lab"); T.dirty = true;
}

// ======================================================================= мем-автомат, гастроли, магазины, задания
function luckyRoll(uid) {
  const u = byUid(uid); if (!u || S.luckyDay === dayIdx()) return;
  const nv = VAR[u.v + 1]; if (!nv || nv.week > week()) return;
  S.luckyDay = dayIdx();
  if (Math.random() < L.lucky[u.v + 1]) { u.v++; toast(`Мем-автомат: ${title(u.id)} теперь ${nv.name}!`, "hot"); sfx("win"); T.dirty = true; }
  else { toast("Мем-автомат: не повезло. Приходи завтра!", "bot"); sfx("no"); }
}
const tourCost = i => Math.max(100, income() / eventMult() * L.tours[i].cost_income_min * 60);
const tourSec = i => L.tours[i].duration_min * 60 * (1 - Math.min(0.5, companionPerk("tour_speed")));
function startTour(i) {
  if (S.tour) { toast("Гастроли уже идут", "hot"); return; }
  const c = tourCost(i); if (S.cash < c) { toast(`Не хватает Кэша: нужно ${fmt(c)}`, "hot"); return; }
  S.cash -= c; S.tour = { i, ends: S.t + tourSec(i), total: tourSec(i) }; addQuest("tour");
  toast(`Брейнроты уехали: «${L.tours[i].name}». Вернутся через ${ftime(tourSec(i))}`);
}
function finishTour() {
  const t = L.tours[S.tour.i]; S.tour = null;
  const likes = likesGain(rint(t.likes[0], t.likes[1])); S.likes += likes;
  let txt = `Гастроли «${t.name}» закончились: +${likes} Лайков`;
  if (Math.random() < t.capsule_chance) { const r = t.epic_plus ? weighted(N.epicPlus) : weighted(RAR.slice(0, 5).map(x => x.weight)); const id = randomBrainrot(r, week()); addReserve({ id, v: 0 }); txt += ` и капсула ${title(id)} в запасе`; }
  toast(txt, "lab");
}
function buyShop(i) {
  const it = L.shop[i], lvl = shopLvl(it.id);
  if (lvl >= it.max_level) return; if (S.crystals < it.cost) { toast(`Нужно ${it.cost} Хайп-кристаллов`, "hot"); return; }
  S.crystals -= it.cost; S.shop[it.id] = lvl + 1; toast(`Куплено: ${it.name}`, "lab"); T.dirty = true;
}
function claimQuest(i) {
  if (!questReady(i)) return; const k = ["easy", "medium", "hard"][i];
  S.quest.claimed[i] = true; const likes = likesGain(L.questRewards[k].likes); let cr = L.questRewards[k].hype_crystals || 0;
  if (shopLvl("daily_crystals")) cr++; S.likes += likes; S.crystals += cr;
  toast(`Задание выполнено: +${likes} Лайков${cr ? `, +${cr} кр.` : ""}`, "lab"); sfx("win");
}
function grantOffer(i) {
  const o = L.offers[i];
  if (o.id === "surge_rainbow") S.psurges.push(3);
  else if (o.id === "surge_lava") S.psurges.push(4);
  else if (o.id === "surge_viral") S.psurges.push(5);
  else if (o.id === "lab_pack") { S.unlocks.lab_pack = 1; S.psurges.push(3, 3); }
  else if (o.id === "fusion_pack") { S.unlocks.fusion_pack = 1; S.psurges.push(4, 4, 4); }
  else { toast(`${o.name}: косметика — в Fortnite это шляпа или краска участка`, "bot"); }
  toast(`Демо-покупка: ${o.name} (в Fortnite — ${o.price} V-Bucks)`, "lab"); T.dirty = true;
}
function grantIcon(id, reason) {
  if (S.units.some(u => u.id === id)) { S.crystals += 10; toast(`${reason}: ${title(id)} уже есть — держи 10 кристаллов`, "lab"); return; }
  const u = { uid: S.uid++, id, v: 0, ideal: false, slot: freeSlot() }; S.units.push(u);
  if (!S.discovered.includes(id)) S.discovered.push(id);
  toast(`${reason}: ты получил икону ${title(id)}!`, "hot"); sfx("win"); T.dirty = true;
}

// ======================================================================= время
function advance(dt) {
  S.t += dt;
  const inc = income(); S.cash += inc * dt;
  S.inc.forEach((c, i) => { if (c && S.t >= c.ends) { S.inc[i] = null; hatch(c.id, c.v, true); } });
  S.fus.forEach((f, i) => { if (f && S.t >= f.ends) { S.fus[i] = null; hatch(f.id, f.v, false); } });
  if (S.tour && S.t >= S.tour.ends) finishTour();
  botsTick(dt); junkTick(); pinataTick();
  if (week() > S.seenWeek) { const w = week(); S.seenWeek = w; setTimeout(() => showPatch(w), 50); }
}
// Перемотка: время проходит как офлайн — 25% дохода, не больше лимита
function skip(seconds, label) {
  const cap = (N.offlineCap + 4 * shopLvl("offline_cap")) * 3600;
  const gain = baseIncome() * globalMult() * N.offlineRate * (1 + companionPerk("offline_bonus")) * Math.min(seconds, cap);
  S.cash += gain; S.t += seconds;
  T.piles.forEach(p => { if (p.kind < 0) p.at = Math.min(p.at, S.t + rnd(2, 10)); }); T.botJunk = [];
  Object.keys(T.next).forEach(k => T.next[k] = Math.min(T.next[k], S.t + 30));
  advance(0);
  if (label) toast(`${label}: брейнроты заработали ${fmt(gain)} (как офлайн, ${Math.round(N.offlineRate * 100)}%)`, "lab");
  T.dirty = true; renderAll();
}
function skipDay() { const next = (dayIdx() + 1) * 86400 + 8 * 3600; skip(next - S.t, `Перемотка до утра (${DAYS_FULL[(weekday() + 1) % 7]})`); }
function skipWeek() { const next = (week() + 1) * 604800 + 8 * 3600; skip(next - S.t, "Перемотка до следующего обновления"); }
function jumpToWeek(w) { if (w <= week()) return; const next = w * 604800 + 8 * 3600; skip(next - S.t, `Перемотка к неделе ${w}`); }

// ======================================================================= пиньята (четверг)
function pinataTick() {
  if (T.pinata && T.pinata.practice) return;
  if (!isThu()) { if (T.pinata && T.pinata.alive) T.pinata.alive = false; return; }
  if (!T.pinata) T.pinata = { alive: false, next: S.t + 20 };
  const p = T.pinata;
  if (!p.alive && S.t >= p.next) { p.alive = true; p.max = N.pinataHits * N.players; p.hp = p.max; p.you = 0; toast("МЕМ-ПИНЬЯТА в центре пьяццы! Бей — награда всем, кто ударил", "hot"); }
}

// ======================================================================= отрисовка
function renderHUD() {

  $("#h-inc").textContent = `+${fmt(income())}/с`;
  $("#h-likes").textContent = fmt(S.likes);

  const h = hour(); $("#h-cal").textContent = `Неделя ${week()} · ${DAYS[weekday()]} ${String(Math.floor(h)).padStart(2, "0")}:${String(Math.floor(h % 1 * 60)).padStart(2, "0")}`;
  document.querySelectorAll("#h-speed button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.arg === S.speed)));
  $("#h-sound").textContent = S.sound ? "Звук: вкл" : "Звук: выкл";
}
function renderLobby() {
  const bestYou = S.units.reduce((b, u) => (!b || unitBase(u.id, u.v) > unitBase(b.id, b.v) ? u : b), null);
  const key = JSON.stringify([bestYou && bestYou.id, S.rebirth, S.gotLikes, T.bots.map(b => [b.best, b.rebirth, likedToday(b.plot)])]);

  $("#lob-sub").textContent = `Лайкни чужую лабораторию: +${N.guestLikes} тебе, +${N.ownerLikes} хозяину, раз в день на каждую · сегодня ${done}/${T.bots.length}`;
  if (key === T.lobbyKey) return; T.lobbyKey = key;
  const you = `<div class="lob you" title="Твоя лаборатория #1"><img src="${bestYou ? bimg(bestYou.id) : pimg("Capsule_Common")}" alt=""><div><span>Ты</span><small>#1 · R${S.rebirth} · ♥ ${S.gotLikes || 0} сегодня</small></div></div>`;
  $("#lobby").innerHTML = you + T.bots.map(b => { const d = likedToday(b.plot);
    return `<div class="lob" title="Лаборатория #${b.plot}"><img src="${bimg(b.best)}" alt=""><div><span>${esc(b.name)}</span><small>#${b.plot} · R${b.rebirth}</small></div><button class="like${d ? " done" : ""}" data-act="like" data-arg="${b.plot}" aria-label="${d ? "Уже лайкнуто сегодня" : `Лайкнуть лабораторию #${b.plot}`}" title="${d ? "Уже лайкнуто сегодня" : `Лайк: +${N.guestLikes} тебе`}"><img src="${pimg("LikeHeart")}" alt=""></button></div>`; }).join("");
}
function renderJunk() {
  const box = $("#junks"), key = JSON.stringify(T.piles.map(p => p.kind));
  if (key !== T.pileKey) {
    T.pileKey = key;
    box.innerHTML = T.piles.map((p, i) => p.kind >= 0
      ? `<button class="pile on" data-act="pile" data-arg="${i}" data-pile="${i}" aria-label="Бить кучу: ${esc(L.junk[p.kind].name)}"><img src="${pimg(JUNK_IMG[p.kind])}" alt=""><small class="pl"></small></button>`
      : `<div class="pile off" data-pile="${i}"><small class="pl"></small></div>`).join("");
  }
  T.piles.forEach((p, i) => { const el = box.querySelector(`[data-pile="${i}"] .pl`); if (el) el.textContent = p.kind >= 0 ? `ещё ${p.left}` : ftime(p.at - S.t); });
  $("#junk-title").textContent = `Мем-мусор · бей кучу (${N.junkHits} ударов) и неси Сахуру${isSpicy() ? " · ОСТРАЯ СУББОТА: мусора вдвое больше" : ""}`;
}
function currentUpdate() { return UPDATES.filter(u => u.week <= week()).pop(); }
function renderEvents() {
  const out = [];
  if (isSat()) {

  jump: { rules: "Прыгай по волнам вверх до флага с Тралалеро (120 м). Управление: стрелки / A-D или кнопки внизу. Упал — попытка заканчивается. Награда — икона Тралалеро Тралала.",

    pad: `<div class="pad"><button class="btn" data-hold="left">←</button><button class="btn" data-hold="right">→</button></div>` },

function createGame(key) {
  const cv = $("#gcv"), ctx = cv.getContext("2d"), W = cv.width, H = cv.height;
  const keys = {}; let raf = 0, running = false, g = null, last = 0;
  const hold = { left: false, right: false };
  const api = { key, stop() { running = false; cancelAnimationFrame(raf); },
    onKey(e, down) { keys[e.key.toLowerCase()] = down; if (down && g && g.tap && (e.key === "6" || e.key === "7")) g.tap(e.key); if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(e.key.toLowerCase())) e.preventDefault(); },
    hold(dir, v) { hold[dir] = v; }, tap(k) { if (g && g.tap) g.tap(k); }, start };

  let ptr = null;

    raf = requestAnimationFrame(loop);
  }
  ctx.fillStyle = "#1a110c"; ctx.fillRect(0, 0, W, H); ctx.fillStyle = "#f6e7c8"; ctx.font = "800 20px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.fillText("Нажми «Старт»", W / 2, H / 2);

function hudText(ctx, W, a, b) { ctx.fillStyle = "rgba(20,12,8,.75)"; ctx.fillRect(0, 0, W, 30); ctx.fillStyle = "#f6e7c8"; ctx.font = "800 15px Nunito, sans-serif"; ctx.textAlign = "left"; ctx.fillText(a, 10, 20); ctx.textAlign = "right"; ctx.fillText(b, W - 10, 20); }
const MAKERS = {
  logs({ W, H, ctx, left, right, end }) {
    const totem = { x: W / 2, y: H / 2 }, p = { x: W / 2, y: H / 2 + 60, tx: null, ty: null }; let carry = 0, done = 0, time = 75;
    const logs = Array.from({ length: 14 }, () => { let x, y; do { x = rnd(30, W - 30); y = rnd(50, H - 30); } while (Math.hypot(x - totem.x, y - totem.y) < 90); return { x, y, got: false }; });
    const tot = sprite(pimg("SahurTotem")), me = sprite(bimg(ICON_SAHUR));
    const g = {
      pointer(pt) { p.tx = pt.x; p.ty = pt.y; }, move() {},
      update(dt) {
        time -= dt; let vx = 0, vy = 0; const sp = 190;
        const K = window.__keys || {};
        if (left()) vx -= 1; if (right()) vx += 1; if (K.up) vy -= 1; if (K.down) vy += 1;
        if (vx || vy) { p.tx = null; } else if (p.tx !== null) { const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy); if (d > 4) { vx = dx / d; vy = dy / d; } else p.tx = null; }
        const len = Math.hypot(vx, vy) || 1; p.x = Math.max(12, Math.min(W - 12, p.x + vx / len * sp * dt)); p.y = Math.max(40, Math.min(H - 12, p.y + vy / len * sp * dt));
        logs.forEach(l => { if (!l.got && Math.hypot(l.x - p.x, l.y - p.y) < 22) { l.got = true; carry++; sfx("buy"); } });
        if (carry && Math.hypot(totem.x - p.x, totem.y - p.y) < 50) { done += carry; carry = 0; sfx("hatch"); }
        T.miniScore = done;
        if (done >= 10) end(true, `Принесено ${done} поленьев.`); else if (time <= 0) end(false, `Принесено ${done} из 10.`);
      },
      draw() {
        ctx.fillStyle = "#6fbf5a"; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#e8d9b5"; ctx.beginPath(); ctx.arc(totem.x, totem.y, 70, 0, 7); ctx.fill(); ctx.fillRect(totem.x - 14, 0, 28, H); ctx.fillRect(0, totem.y - 14, W, 28);
        logs.forEach(l => { if (l.got) return; ctx.fillStyle = "#8b5a33"; ctx.beginPath(); ctx.ellipse(l.x, l.y, 16, 8, 0.4, 0, 7); ctx.fill(); ctx.fillStyle = "#c89b6d"; ctx.beginPath(); ctx.arc(l.x + 12, l.y + 5, 5, 0, 7); ctx.fill(); });

      } };

  },
  jump({ W, H, ctx, left, right, end }) {
    const goal = 120 * 30, p = { x: W / 2, y: H - 60, vy: -520, vx: 0 }; let cam = 0, best = 0, time = 0;
    const plats = [{ x: W / 2 - 50, y: H - 30, w: 100 }]; let top = H - 30;
    while (top > -goal - 200) { top -= rnd(55, 90); plats.push({ x: rnd(10, W - 110), y: top, w: rnd(70, 110), move: Math.random() < 0.2 ? rnd(-60, 60) : 0 }); }
    const shark = sprite(bimg(ICON_TRALA));
    return {
      update(dt) {
        time += dt; p.vx = (left() ? -260 : 0) + (right() ? 260 : 0); p.x = (p.x + p.vx * dt + W) % W; p.vy += 980 * dt; const oy = p.y; p.y += p.vy * dt;
        plats.forEach(pl => { if (pl.move) { pl.x += pl.move * dt; if (pl.x < 0 || pl.x + pl.w > W) pl.move *= -1; }
          if (p.vy > 0 && oy <= pl.y && p.y >= pl.y && p.x > pl.x - 8 && p.x < pl.x + pl.w + 8) { p.y = pl.y; p.vy = -560; sfx("hit"); } });
        cam = Math.min(cam, p.y - H * 0.45); const h = Math.max(0, (H - 60 - p.y) / 30); best = Math.max(best, h); T.miniScore = best;
        if (best >= 120) end(true, `Высота 120 м за ${Math.round(time)} с.`); else if (p.y - cam > H + 40) end(false, `Высота ${Math.floor(best)} м из 120.`);
      },
      draw() {
        const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#7fd0ff"); sky.addColorStop(1, "#1d5fb8"); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.translate(0, -cam);
        plats.forEach(pl => { if (pl.y - cam < -20 || pl.y - cam > H + 20) return; ctx.fillStyle = "#e9f7ff"; ctx.beginPath(); ctx.roundRect(pl.x, pl.y, pl.w, 12, 6); ctx.fill(); ctx.fillStyle = "#4fa8ff"; ctx.fillRect(pl.x + 4, pl.y + 8, pl.w - 8, 4); });
        const gy = H - 60 - goal; ctx.fillStyle = "#ffd23f"; ctx.fillRect(0, gy, W, 6); if (shark.complete) ctx.drawImage(shark, W / 2 - 40, gy - 80, 80, 80);
        ctx.fillStyle = "#ff4f7b"; ctx.beginPath(); ctx.arc(p.x, p.y - 12, 12, 0, 7); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillRect(p.x - 5, p.y - 16, 4, 4); ctx.fillRect(p.x + 2, p.y - 16, 4, 4);
        ctx.restore(); hudText(ctx, W, `Высота: ${Math.floor(best)} / 120 м`, `${Math.floor(time)} с`);
        $("#g-score").textContent = `Высота ${Math.floor(best)} м`; $("#g-time").textContent = `${Math.floor(time)} с`;
      } };
  },
  lava: catcher({ good: "Capsule_Mythic", goodColor: "#ff5a00", bad: "#3a2a22", need: 6, time: 40, sky: ["#2b120a", "#6b1d0a"], basket: 4, label: "Капсулы" }),
  stars: catcher({ good: null, goodColor: "#ffe58a", bad: "#8a7fb0", need: 20, time: 40, sky: ["#0b0620", "#2a0f5c"], basket: 6, label: "Звёзды", star: true }),
  rhythm({ W, H, ctx, end }) {
    const notes = []; let t = 0, hits = 0, miss = 0; const lineY = H - 70, speed = 230;
    for (let i = 0; i < 32; i++) notes.push({ k: Math.random() < 0.5 ? "6" : "7", at: 1.2 + i * 0.85 + (Math.random() < 0.25 ? 0.42 : 0), done: false });
    let flash = { k: null, ok: false, t: 0 };
    const g = {
      tap(k) { const n = notes.find(n => !n.done && n.k === k && Math.abs((t - n.at) * speed) < 36); if (n) { n.done = true; hits++; flash = { k, ok: true, t: 0.2 }; sfx("buy"); } else { flash = { k, ok: false, t: 0.2 }; sfx("no"); } },
      update(dt) { t += dt; flash.t -= dt; notes.forEach(n => { if (!n.done && (t - n.at) * speed > 40) { n.done = true; miss++; } }); T.miniScore = hits;
        if (notes.every(n => n.done)) { const acc = hits / notes.length; end(acc >= 0.7, `Точность ${Math.round(acc * 100)}% (${hits}/${notes.length}).`); } },

        ["6", "7"].forEach((k, i) => { const x = W / 2 + (i ? 70 : -70); ctx.fillStyle = flash.t > 0 && flash.k === k ? (flash.ok ? "#57c84d" : "#e03a3e") : "#33231a"; ctx.fillRect(x - 50, 30, 100, H - 30);
          ctx.fillStyle = "#f6e7c8"; ctx.font = "800 28px Unbounded, sans-serif"; ctx.textAlign = "center"; ctx.fillText(k, x, H - 18); });
        ctx.fillStyle = "#ffd23f"; ctx.fillRect(W / 2 - 130, lineY - 2, 260, 4);

        hudText(ctx, W, `Попадания: ${hits} · промахи: ${miss}`, `${notes.filter(n => !n.done).length} нот`);
        $("#g-score").textContent = `Попадания ${hits}/32`; $("#g-time").textContent = "";
      } };
    return g;
  },
};
function catcher(o) {
  return ({ W, H, ctx, left, right, end }) => {

// ======================================================================= события ввода
document.addEventListener("click", e => {

    case "inc": incInteract(n); break;
    case "unit": unitModal(n); return;
    case "place": place(n); unitModal(n); break;
    case "unplace": unplace(n); unitModal(n); break;
    case "upgrade": upgrade(n); unitModal(n); break;
    case "sell": sell(n); closeModal(); break;
    case "comp": toggleCompanion(n); unitModal(n); break;
    case "arrange": autoArrange(); break;
    case "rebirth": doRebirth(); break;
    case "super": doSuper(); break;
    case "fpick": if (S.fusionPick.includes(n)) S.fusionPick = S.fusionPick.filter(x => x !== n); else if (S.fusionPick.length < 3) S.fusionPick.push(n); break;
    case "fclear": S.fusionPick = []; break;

    case "lucky": luckyRoll(n); break;
    case "tour": startTour(n); break;
    case "shop": buyShop(n); break;
    case "offer": grantOffer(n); break;
    case "quest": claimQuest(n); break;
    case "like": likePlot(n); break;

    case "deliver": deliverJunk(); break;

    case "mini": openMini(arg); return;
    case "gstart": if (T.mini && T.mini.start) T.mini.start(); return;
    case "pinhit": hitPinata(); return;
    case "close": closeModal(); break;
    case "speed": S.speed = n; break;
    case "sound": S.sound = !S.sound; if (S.sound) sfx("buy"); break;
    case "skipday": skipDay(); break;
    case "skipweek": skipWeek(); break;
    case "jump": jumpToWeek(n); break;
    case "reset": T.confirmReset = true; break;
    case "reset0": T.confirmReset = false; break;

document.addEventListener("keydown", e => {

// ======================================================================= цикл
function renderAll() { renderHUD(); renderLobby(); renderJunk(); renderEvents(); renderBelt(); renderHands(); renderStations(); renderIncs(); renderPodium(); renderPanel(); }
let lastFrame = performance.now(), saveAcc = 0, uiAcc = 0, panelAcc = 0;
function frame(now) {
  const real = Math.min(0.25, (now - lastFrame) / 1000); lastFrame = now;
  advance(real * S.speed);
  T.beltAcc += real * Math.min(S.speed, 4);
  const step = N.beltStep;
  if (T.beltAcc >= step) { T.beltAcc -= step; if (T.beltAcc > step) T.beltAcc = 0; beltStep(false); }
  uiAcc += real; panelAcc += real; saveAcc += real;
  if (uiAcc >= 0.1) { uiAcc = 0; renderHUD(); renderJunk(); renderIncs(); renderPodium(); renderHands(); }
  if (panelAcc >= 1 || T.dirty) {
    const wasDirty = T.dirty; panelAcc = 0; T.dirty = false; renderLobby(); renderEvents(); renderStations(); renderBelt();
    // списки без таймеров перерисовываем только при изменениях, чтобы не сбивать наведение и прокрутку
    if (wasDirty || !["storage", "dex", "updates", "guide", "shop"].includes(S.tab)) renderPanel(); else renderTabs();

function start(data) {
  S = (data && data.save) ? migrate(Object.assign(fresh(), data.save)) : (load() || fresh());
  const away = (Date.now() - (S.lastReal || Date.now())) / 1000;
  initBots(); initJunk(); initBelt();
  if (away > 60 && S.units.length) {
    const before = S.cash; skip(away, null); const gain = S.cash - before;
    openModal(`<div class="dialog-head"><h2>С возвращением!</h2><button class="btn sm go" data-act="close">Забрать</button></div>
      <p>Тебя не было ${ftime(away)}. Брейнроты заработали <b class="num">${fmt(gain)}</b> Кэша (офлайн — ${Math.round(N.offlineRate * 100)}% дохода, до ${N.offlineCap} ч). Инкубаторы, скрещивание и гастроли тоже шли.</p>`);
  }

}
window.addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
